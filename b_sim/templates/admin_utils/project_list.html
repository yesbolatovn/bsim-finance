<!DOCTYPE html>
{% extends "base.html" %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project List</title>
</head>
<body>
    <h1>Project List</h1>
    <ul>
        {% for project in projects %}
        <li>
            <a href="{% url 'manage_project' project.id %}">{{ project.project_name }}</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
{% endblock %}
