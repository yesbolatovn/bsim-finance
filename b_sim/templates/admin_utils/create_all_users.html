<!DOCTYPE html>
{% extends "base.html" %}
{% block content %}
<html>
<head>
    <title>Create All Users</title>
</head>
<body>
    <h1>Create Users</h1>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <button type="submit">Create Users</button>
    </form>
</body>
</html>
{% endblock %}
