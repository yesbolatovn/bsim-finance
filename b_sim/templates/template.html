<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Add your CSS styles here */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }
        .big-box {
            border: 1px solid #000;
            padding: 20px;
            text-align: center;
            margin: 10px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .button {
            background-color: #0074D9;
            color: #FFF;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        /* Decrease space between containers */
        .container + .container {
            margin-top: 20px; /* Adjust as needed */
        }
    </style>
    <title>Output Parameters</title>
</head>
<body>
    <div class="container">
        <div class="big-box">
            <div class="header-box">Output Parameters</div>
            <div class="button-container">
                <button class="button">36 - Mo - Fin - Pr</button>
                <button class="button">D - Analysis</button>
                <button class="button">Performance</button>
            </div>
        </div>
        <div class="big-box">
            <div class="header-box">Project Begin</div>
            <div class="button-container">
                <button class="button">Set-up Profile</button>
                <button class="button">Project Start</button>
            </div>
        </div>
        <div class="big-box">
            <div class="header-box">Input Parameters</div>
            <div class="button-container">
                <button class="button">Marketing Management</button>
                <button class="button">Innovation & Technology Management</button>
                <button class="button">Operations Management</button>
                <button class="button">Financial Management</button>
                <button class="button">Organizational & HR Management</button>
             </div>
        </div>
    </div>
    <div class="container">
        <div class="big-box">
            <div class="header-box">Cycle Dashboard</div>
            <div class="button-container">
                <button class="button">Create Cycle</button>
                <button class="button">Select Cycle</button>
                <button class="button">Display Current Cycle</button>
                <button class="button">Current Input Parameter Table</button>
            </div>
        </div>
    </div>
</body>
</html>
