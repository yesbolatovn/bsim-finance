<form method="POST" action="{% url 'optimize_market_prices' %}">
    {% csrf_token %}
    <label>Min Price (comma-separated):</label>
    <input type="text" name="min_price" required><br>

    <label>Max Price (comma-separated):</label>
    <input type="text" name="max_price" required><br>

    <label>Min Consumption Deviation:</label>
    <input type="text" name="min_consumption_deviation" required><br>

    <label>Max Consumption Deviation:</label>
    <input type="text" name="max_consumption_deviation" required><br>

    <button type="submit">Optimize</button>
</form>
