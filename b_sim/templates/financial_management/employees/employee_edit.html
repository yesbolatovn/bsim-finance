<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employees</title>

    <link rel="stylesheet" href="{% static 'b_sim/css/forms.css' %}">
</head>
<body>
    <h1>Edit Employees</h1>
    <form method="post">
        {% csrf_token %}
        <label>Employee Position:</label>
        {{ form.employee_position }}
        <br/>
        <label>Employee Budget - FY1</label>
        {{ form.employee_budget_fy1 }}
        <br/>
        <label>Number of Employees</label>
        {{ form.employee_num }}
        <br/>
        <label>Employee Budget - FY2 Multiplier</label>
        {{ form.employee_fy2_multiplier }}
        <label>Employee Budget - FY2</label><input type="text" id="id_employee_budget_fy2" readonly>
        <br/>
        <label>Employee Budget - FY3 Multiplier</label>
        {{ form.employee_fy3_multiplier }}
        <label>Employee Budget - FY2</label><input type="text" id="id_employee_budget_fy3" readonly>
        <br/>
        <button type="submit">Save Changes</button>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const fields = {
                fy1: document.querySelector('#id_employee_budget_fy1'),
                fy2Multiplier: document.querySelector('#id_employee_fy2_multiplier'),
                fy2Value: document.querySelector('#id_employee_budget_fy2'),
                fy3Multiplier: document.querySelector('#id_employee_fy3_multiplier'),
                fy3Value: document.querySelector('#id_employee_budget_fy3')
            };

            function calculateFyValue(fyInput, multiplierInput, valueInput) {
                const fyValue = parseFloat(fyInput.value);
                const multiplier = parseFloat(multiplierInput.value);
                const calculatedValue = fyValue * multiplier;
                valueInput.value = isNaN(calculatedValue) ? 0 : calculatedValue.toFixed(2);
            }

            function calculateAll() {
                calculateFyValue(fields.fy1, fields.fy2Multiplier, fields.fy2Value);
                calculateFyValue(fields.fy2Value, fields.fy3Multiplier, fields.fy3Value);
            }

            calculateAll(); // Calculate initial values

            // Optional: Recalculate values if any input changes
            Object.values(fields).forEach(function(input) {
                input.addEventListener('input', calculateAll);
            });
        });
    </script>
</body>
</html>
