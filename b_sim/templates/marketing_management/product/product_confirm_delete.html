<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Confirm Deletion</title>

    <link rel="stylesheet" href="{% static 'b_sim/css/forms.css' %}">
</head>
<body>
    <h1>Confirm Deletion</h1>
    <p>Are you sure you want to delete product "{{ entry.product_name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm</button>
    </form>
    <br>
    <a href="{% url 'marketing_management' %}">Cancel</a>
</body>
</html>
