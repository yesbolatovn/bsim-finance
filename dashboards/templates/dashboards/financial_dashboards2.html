{% extends "base.html" %}
{% load plotly_dash %}

{% block content %}
<h1 class="text-center my-4">Financial Dashboards for {{ project.project_name }} - Cycle {{ cycle }}</h1>

<style>
    /* Ensure full visibility without scrolling */
    .dashboard-container {
        {#display: flex;#}
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 1600px;
        margin: auto;
        padding: 20px;
    }

    .dash-graph {
        flex: 1 1 48%; /* Each graph takes up nearly half the width */
        height: 400px; /* Fixed height */
        margin-bottom: 20px; /* Add spacing between rows */
    }

    .dash-title {
        font-size: 1.5rem;
        font-weight: bold;
        text-align: center;
        margin-bottom: 10px;
    }
</style>

<!-- Store Project and Cycle ID -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        sessionStorage.setItem("project_id", "{{ project_id }}");
        sessionStorage.setItem("cycle_id", "{{ cycle_id }}");
    });
</script>



<!-- Render Dash App -->
<div class="dashboard-container">
    {% plotly_app name="FinancialDashboards" %}
</div>

<a href="{% url 'financial_statements' %}" class="btn btn-secondary mt-3">Back to Financial Statements</a>
{% endblock %}
